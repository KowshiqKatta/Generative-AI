[project]
name = "rag-guardrails"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "competitor-check",
    "detect-jailbreak",
    "guardrails-ai>=0.10.2",
    "guardrails-pii",
    "ipykernel>=7.3.0",
    "langchain>=1.3.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.6",
    "langchain-openai>=1.3.0",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.2.2",
    "response-evaluator",
    "restricttotopic",
    "toxic-language",
]

[tool.uv.sources]
guardrails-pii = { git = "https://github.com/guardrails-ai/guardrails_pii" }
detect-jailbreak = { git = "https://github.com/guardrails-ai/detect_jailbreak" }
response-evaluator = { git = "https://github.com/guardrails-ai/response_evaluator" }
